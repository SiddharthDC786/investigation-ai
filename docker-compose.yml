services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil2026
      POSTGRES_DB: crime_network
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./dataset/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil -d crime_network"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/vigilneo4j2026
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://vigil:vigil2026@postgres:5432/crime_network
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: vigilneo4j2026
      NEO4J_ENABLED: "true"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://vigil:vigil2026@postgres:5432/crime_network
    volumes:
      - ./dataset:/app/dataset:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["python", "/app/dataset/import_to_db.py"]
    command:
      [
        "--host",
        "postgres",
        "--user",
        "vigil",
        "--password",
        "vigil2026",
        "--database",
        "crime_network",
        "--data-dir",
        "/app/dataset/data",
        "--schema-file",
        "/app/dataset/schema.sql",
        "--skip-schema",
      ]

volumes:
  pg_data:
  neo4j_data:
