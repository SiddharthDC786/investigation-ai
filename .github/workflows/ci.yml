name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vigil
          POSTGRES_PASSWORD: vigil2026
          POSTGRES_DB: crime_network
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://vigil:vigil2026@localhost:5432/crime_network
      AUTH_ENABLED: "true"
      NEO4J_ENABLED: "false"
      JWT_SECRET: ci-test-secret-change-me
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Load schema and CI seed
        run: |
          psql "$DATABASE_URL" -f dataset/schema.sql
          psql "$DATABASE_URL" -f dataset/ci_seed.sql
      - name: Run pytest
        working-directory: backend
        run: pytest -q
      - name: Run eval metrics
        working-directory: backend
        run: python ../dataset/eval/run_eval.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
